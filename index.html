<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Halka: büyük spor organizasyonları için sağlık hizmetlerini tek zincirde birleştiren yazılım platformu.">
<meta name="robots" content="noindex">
<title>İstanbul 2027 Health Directorate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#041433; --deep:#072a73; --cobalt:#0a4bd6; --sky:#4ea1ff; --ice:#eef4ff; --ink:#0b1b3d; --mute:#5a6b8c; --line:#d9e4f7; --white:#fff;
  --f:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font:400 1.0625rem/1.65 var(--f);overflow-x:hidden}
a{color:inherit}
h1,h2,h3{font-weight:300;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.pad{padding-inline:clamp(20px,5vw,72px)}
.wrap{max-width:1180px;margin-inline:auto}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:4px}

/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:30;transition:background .35s,box-shadow .35s;padding-top:env(safe-area-inset-top,0px)}
header.solid{background:rgba(4,20,51,.92);backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;height:4.4rem}
.brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none;font-weight:600;font-size:1.25rem;letter-spacing:.01em}
.brand svg{width:1.7rem;height:1.7rem}
nav{display:flex;gap:2rem;font-size:.95rem;font-weight:500}
nav a{color:#ffffffcc;text-decoration:none}nav a:hover{color:#fff}
.pill{color:var(--navy);background:#fff;text-decoration:none;font-weight:600;font-size:.92rem;padding:.55rem 1.15rem;border-radius:999px;transition:.2s}
.pill:hover{background:var(--sky);color:#fff}
@media(max-width:820px){nav{display:none}}

/* hero slider */
.hero{position:relative;height:100vh;height:100svh;min-height:600px;background:var(--navy);color:#fff;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s 1s;background:var(--bg)}
.slide.on{opacity:1;visibility:visible;transition:opacity 1s ease}
.slide .fig{position:absolute;right:clamp(0px,5vw,90px);bottom:6vh;height:min(78%,760px);aspect-ratio:1;transform:translateX(90px);opacity:0;transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity 1s}
.slide.on .fig{transform:none;opacity:1}
.slide .fig svg{width:100%;height:100%;overflow:visible}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.streak{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#ffffff77);animation:st linear infinite}
@keyframes st{from{transform:translateX(30vw)}to{transform:translateX(-130vw)}}
.ring{position:absolute;border:1.5px solid #ffffff22;border-radius:50%;right:calc(5vw + 6vh);top:50%;translate:0 -50%;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.wave{position:absolute;left:0;width:200%;bottom:0;height:42%;opacity:.25;animation:wv 14s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}

.cap{position:absolute;left:clamp(20px,5vw,72px);bottom:clamp(88px,13vh,130px);max-width:30rem;z-index:5}
.cap small{display:block;font-size:.85rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:.8rem}
.cap h2{font-size:clamp(1.8rem,3.6vw,2.9rem);font-weight:400}
.cap p{margin-top:.8rem;color:#ffffffc4;font-size:1.05rem}
.slide .cap>*{opacity:0;transform:translateY(16px);transition:.9s .35s}
.slide.on .cap>*{opacity:1;transform:none}
.slide.on .cap h2{transition-delay:.45s}.slide.on .cap p{transition-delay:.55s}

.lead{position:absolute;left:clamp(20px,5vw,72px);top:clamp(6.2rem,17vh,9rem);z-index:6;max-width:46rem;pointer-events:none}
.lead h1{font-size:clamp(2.1rem,4.4vw,4rem);font-weight:300;color:#fff}
.lead .sub2{margin-top:1.1rem;font-size:1.15rem;color:#ffffffcc;font-weight:500}
.lead h1 b{font-weight:600}
.ctrl{position:absolute;z-index:7;left:clamp(20px,5vw,72px);right:clamp(20px,5vw,72px);bottom:clamp(20px,4.5vh,40px);display:flex;align-items:center;gap:1.2rem}
.tick{flex:1;display:flex;gap:.6rem}
.tick button{flex:1;max-width:5.5rem;height:1.6rem;background:none;border:0;cursor:pointer;display:flex;align-items:center;padding:0}
.tick button i{display:block;width:100%;height:3px;background:#ffffff40;border-radius:3px;overflow:hidden}
.tick button i::after{content:"";display:block;height:100%;width:0;background:var(--tc,#fff)}
.tick button.on i::after{animation:fill var(--d,7s) linear forwards}
.tick button.done i::after{width:100%}
.paused .tick button.on i::after{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.arrows{display:flex;gap:.5rem}
.arrows button{width:2.8rem;height:2.8rem;border-radius:50%;border:1px solid #ffffff55;background:#ffffff10;color:#fff;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:.2s}
.arrows button:hover{background:#fff;color:var(--navy)}
.scroll{position:absolute;right:clamp(20px,5vw,72px);bottom:clamp(76px,12vh,110px);z-index:7;writing-mode:vertical-rl;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#ffffffa0;text-decoration:none}
@media(max-width:820px){
  .slide .fig{right:50%;translate:50% 0;height:42%;bottom:auto;top:38%}
  .lead{top:5.4rem}.lead h1{font-size:clamp(1.9rem,8.2vw,2.8rem)}
  .cap{bottom:5.2rem;max-width:none;right:20px}
  .cap p{font-size:.98rem}
  .scroll{display:none}.arrows{display:none}
}

/* intro */
.intro{padding-block:clamp(4rem,10vw,8rem)}
.intro p{font-size:clamp(1.5rem,3.2vw,2.5rem);font-weight:300;line-height:1.3;max-width:26em;letter-spacing:-.01em}
.intro p em{font-style:normal;color:var(--cobalt);font-weight:500}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:3.5rem;border-top:1px solid var(--line);padding-top:2rem}
.facts strong{display:block;font-size:clamp(2.4rem,5vw,3.6rem);font-weight:300;letter-spacing:-.03em;color:var(--cobalt);font-variant-numeric:tabular-nums;line-height:1}
.facts span{display:block;margin-top:.5rem;color:var(--mute);font-size:.95rem}
@media(max-width:700px){.facts{grid-template-columns:repeat(2,1fr)}}

/* platform */
.plat{background:var(--navy);color:#fff;padding-block:clamp(4rem,9vw,7rem);position:relative;overflow:hidden}
.plat::before{content:"";position:absolute;width:60vw;height:60vw;right:-20vw;top:-25vw;background:radial-gradient(closest-side,#0a4bd655,transparent);}
.plat h2{font-size:clamp(2rem,4.6vw,3.6rem);max-width:15em;position:relative}
.plat .sub{color:#ffffffb0;max-width:34em;margin-top:1.1rem;position:relative}
.tabs{display:flex;gap:.4rem;margin-top:2.4rem;position:relative;flex-wrap:wrap}
.tabs button{font:500 .95rem var(--f);color:#ffffffb8;background:none;border:1px solid #ffffff2a;border-radius:999px;padding:.55rem 1.2rem;cursor:pointer;transition:.2s}
.tabs button:hover{color:#fff}
.tabs button[aria-selected=true]{background:#fff;color:var(--navy);border-color:#fff}
.win{margin-top:1.6rem;border-radius:16px;background:#0a1f4a;border:1px solid #ffffff1c;box-shadow:0 40px 80px -30px #000a;overflow:hidden;position:relative}
.wbar{display:flex;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid #ffffff14;font-size:.82rem;color:#ffffff90}
.wbar i{width:.65rem;height:.65rem;border-radius:50%;background:#ffffff30;display:block}
.wbar span{margin-left:.8rem}
.wbody{display:grid;grid-template-columns:11rem 1fr;min-height:23rem}
.side{border-right:1px solid #ffffff14;padding:1rem .8rem;display:grid;align-content:start;gap:.2rem;font-size:.9rem;color:#ffffff90}
.side div{padding:.5rem .7rem;border-radius:8px}
.side .a{background:#ffffff14;color:#fff}
.main{padding:1.3rem;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.kpi{background:#ffffff0d;border-radius:10px;padding:.8rem 1rem}
.kpi b{display:block;font-size:1.7rem;font-weight:300;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:#ffffff90}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:1.2rem;margin-top:1.1rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.6rem;padding:.65rem 0;border-bottom:1px solid #ffffff12;font-size:.92rem;align-items:center}
.row small{display:block;color:#ffffff80;font-size:.78rem}
.tag{font-size:.74rem;font-weight:600;padding:.18rem .6rem;border-radius:999px;background:#4ea1ff2a;color:#9cc9ff;white-space:nowrap}
.tag.ok{background:#3ddc8a24;color:#7be9b0}.tag.wait{background:#ffffff1c;color:#fff}
.bars div{margin-bottom:.9rem;font-size:.88rem}
.bars em{display:block;height:6px;border-radius:6px;background:#ffffff1a;margin-top:.35rem;overflow:hidden;font-style:normal}
.bars em::after{content:"";display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--cobalt),var(--sky));border-radius:6px;transition:width 1s}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-top:1.2rem}
.node{background:#ffffff0d;border-radius:10px;padding:.9rem .8rem;font-size:.85rem;position:relative;border:1px solid transparent}
.node b{display:block;font-weight:600;margin-bottom:.2rem}
.node time{color:#ffffff80;font-size:.78rem}
.node.ok{border-color:#3ddc8a55}.node.cur{border-color:var(--sky);animation:bl 1.6s infinite}
@keyframes bl{50%{background:#4ea1ff22}}
.prog{height:8px;border-radius:8px;background:#ffffff1a;margin-top:1.2rem;overflow:hidden}
.prog i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--cobalt),var(--sky));transition:width 1.2s}
.chk{display:grid;gap:.1rem;margin-top:.8rem}
.chk div{display:flex;gap:.7rem;padding:.5rem 0;font-size:.92rem;border-bottom:1px solid #ffffff12}
.chk b{width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid #ffffff55;flex:none;margin-top:.15rem;display:grid;place-items:center;font-size:.7rem}
.chk .d b{background:#3ddc8a;border-color:#3ddc8a;color:var(--navy)}
@media(max-width:760px){.wbody{grid-template-columns:1fr}.side{display:none}.two{grid-template-columns:1fr}.chain{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:1.3rem}}

/* capabilities */
.cap-s{padding-block:clamp(4rem,9vw,7rem)}
.cap-s h2{font-size:clamp(2rem,4.2vw,3.2rem);max-width:14em}
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:4rem;margin-top:3rem}
.list div{display:grid;grid-template-columns:3rem 1fr;gap:.2rem 1rem;padding:1.4rem 0;border-top:1px solid var(--line);min-width:0}
.list svg{width:2rem;height:2rem;color:var(--cobalt);grid-row:span 2}
.list h3{font-size:1.25rem;font-weight:500;letter-spacing:-.01em}
.list p{color:var(--mute);font-size:.98rem}
@media(max-width:760px){.list{grid-template-columns:1fr}}

/* path */
.path{background:var(--ice);padding-block:clamp(3.5rem,8vw,6rem)}
.path h2{font-size:clamp(1.9rem,4vw,3rem)}
.rail{margin-top:3rem;display:grid;grid-template-columns:repeat(5,1fr);gap:1.2rem;position:relative}
.rail::before{content:"";position:absolute;left:0;right:0;top:.45rem;height:2px;background:var(--line)}
.rail div{position:relative;padding-top:1.8rem;min-width:0}
.rail div::before{content:"";position:absolute;left:0;top:0;width:.9rem;height:.9rem;border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 5px var(--ice)}
.rail div:last-child::before{background:var(--sky)}
.rail b{display:block;font-weight:600}
.rail span{color:var(--mute);font-size:.95rem;display:block;margin-top:.2rem}
@media(max-width:860px){.rail{grid-template-columns:1fr;gap:1.6rem}.rail::before{left:.43rem;right:auto;width:2px;top:0;bottom:0;height:auto}.rail div{padding:0 0 0 2rem}.rail div::before{top:.35rem}}

/* contact */
.contact{margin-block:clamp(3rem,7vw,6rem)}
.cbox{background:linear-gradient(120deg,var(--deep),var(--cobalt));color:#fff;border-radius:28px;padding:clamp(2rem,6vw,5rem);position:relative;overflow:hidden}
.cbox::after{content:"";position:absolute;width:30rem;height:30rem;right:-8rem;bottom:-14rem;border-radius:50%;border:1.5px solid #ffffff2e;box-shadow:0 0 0 3rem #ffffff08,0 0 0 6rem #ffffff06}
.cbox h2{font-size:clamp(2rem,4.4vw,3.4rem);max-width:12em}
.cbox p{margin-top:1rem;max-width:32em;color:#ffffffcc;position:relative}
.cbox .r{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2rem;position:relative;align-items:center}
.mail{border:1px dashed #ffffff80;border-radius:999px;padding:.7rem 1.3rem;font-weight:500}
footer{padding-block:2rem 3rem;color:var(--mute);font-size:.88rem;border-top:1px solid var(--line)}
footer p+p{margin-top:.5rem;max-width:56em}

.ecg{position:absolute;left:0;right:0;top:43%;height:140px;z-index:2;pointer-events:none}
.ecg svg,.ecgd svg{width:100%;height:100%;display:block;overflow:visible}
.ecg path,.ecgd path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.ecg .base{stroke:#ffffff2e;stroke-width:2}
.ecg .pulse{stroke:#8fd6ff;stroke-width:3.5;stroke-dasharray:.1 1;animation:ecg 3.8s linear infinite;filter:drop-shadow(0 0 7px #4ea1ff)}
@keyframes ecg{from{stroke-dashoffset:.1}to{stroke-dashoffset:-1}}
.ecgd{height:56px;margin-top:3rem}
.ecgd .base{stroke:var(--line);stroke-width:2}
.ecgd .pulse{stroke:var(--cobalt);stroke-width:3;stroke-dasharray:.08 1;animation:ecg 4.5s linear infinite}
.plus{position:absolute;width:var(--s);height:var(--s);opacity:.16;animation:fl 9s ease-in-out infinite alternate}
.plus::before,.plus::after{content:"";position:absolute;background:#fff;border-radius:2px}
.plus::before{left:34%;right:34%;top:0;bottom:0}.plus::after{top:34%;bottom:34%;left:0;right:0}
@keyframes fl{from{transform:translateY(24px)}to{transform:translateY(-110px)}}
.vit{position:absolute;right:clamp(20px,5vw,72px);top:6.2rem;z-index:6;display:flex;align-items:center;gap:1.1rem;padding:.8rem 1.1rem;border-radius:16px;background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(10px);opacity:0;transform:translateY(-10px);transition:.9s .6s}
.slide.on .vit{opacity:1;transform:none}
.vit svg{width:2rem;height:2rem;color:#ff6b81;animation:hb 1s ease-in-out infinite;flex:none}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
.vit div{line-height:1.1}.vit b{font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;display:block}
.vit small{font-size:.72rem;color:#ffffffa8;letter-spacing:.06em}
.vit em{font-style:normal;font-size:.7rem;font-weight:600;color:#7be9b0;letter-spacing:.1em;text-transform:uppercase;margin-left:.2rem}
@media(max-width:820px){.vit{top:auto;bottom:auto;right:20px;top:calc(50% - 1rem);padding:.5rem .8rem;gap:.7rem}.vit b{font-size:1.15rem}.vit svg{width:1.5rem;height:1.5rem}.ecg{top:36%}}

/* olympic spirit */
.topstripe{position:fixed;left:0;right:0;top:0;height:4px;z-index:50;background:linear-gradient(90deg,#0085c7 0 20%,#f4c300 20% 40%,#1c2230 40% 60%,#009f3d 60% 80%,#df0024 80%)}
.five{display:flex;gap:7px;margin-bottom:1.1rem}
.five i{width:11px;height:11px;border-radius:50%;display:block}
.five i:nth-child(1){background:#0085c7}.five i:nth-child(2){background:#f4c300}.five i:nth-child(3){background:#1c2230;box-shadow:0 0 0 1.5px #ffffff55}.five i:nth-child(4){background:#009f3d}.five i:nth-child(5){background:#df0024}
.path .five i:nth-child(3),.cap-s .five i:nth-child(3),.intro .five i:nth-child(3){box-shadow:none}
.wreath{position:absolute;right:clamp(0px,3vw,64px);bottom:3vh;height:min(88%,820px);aspect-ratio:1;color:#fff;opacity:.09;pointer-events:none}
.wreath svg{width:100%;height:100%}
.facts div{border-top:4px solid var(--oc);padding-top:.9rem}
.facts{border-top:0!important;padding-top:0!important}
.rail div:nth-child(1)::before{background:#0085c7}.rail div:nth-child(2)::before{background:#f4c300}.rail div:nth-child(3)::before{background:#1c2230}.rail div:nth-child(4)::before{background:#009f3d}.rail div:nth-child(5)::before{background:#df0024}
.pod{position:absolute;right:7%;bottom:0;width:min(260px,34%);z-index:1}
@media(max-width:700px){.pod{display:none}}
.ecg{top:47%}
@media(max-width:820px){.wreath{right:50%;translate:50% 0;height:56%;bottom:auto;top:30%}.ecg{top:40%}}

/* photo slides + contribution tiles */
.slide .ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.07);transition:opacity 1.2s,transform 9s ease-out}
.slide .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,20,51,.9) 0%,rgba(7,42,115,.62) 52%,rgba(10,75,214,.28) 100%)}
.slide.hasphoto .ph{opacity:1}.slide.hasphoto.on .ph{transform:scale(1)}
.slide.hasphoto .fig,.slide.hasphoto .wreath{display:none}
.slide.phs .vit{display:none}
.bring{padding-block:clamp(3.5rem,8vw,6rem)}
.bring h2{font-size:clamp(1.9rem,4vw,3rem);max-width:16em}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);margin-top:2.4rem;border-radius:20px;overflow:hidden}
.tile{position:relative;overflow:hidden;min-height:26rem;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:1.6rem;background:var(--c)}
.tile .tbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 30%,transparent) 0%,var(--c) 88%)}
.tile:hover .tbg{transform:scale(1.06)}
.tile>*{position:relative;z-index:1}
.tile .ticon{position:absolute;z-index:1;top:1.6rem;left:1.6rem;width:5.5rem;height:5.5rem;opacity:.95}
.tile .ticon svg{width:100%;height:100%}
.tile h3{font-size:1.7rem;font-weight:300;line-height:1.1}
.tile h3 b{font-weight:700}
.tile p{margin-top:.7rem;font-size:.98rem;color:#ffffffe0;max-width:20em}
@media(max-width:980px){.tiles{grid-template-columns:repeat(2,1fr)}.tile{min-height:21rem}}
@media(max-width:560px){.tiles{grid-template-columns:1fr}.tile{min-height:17rem}}
.bt{display:flex;flex-direction:column;line-height:1.1;font-size:1.05rem}
.bt small{font-size:.66rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#ffffffb0;margin-top:.2rem}
.lang{display:flex;border:1px solid #ffffff55;border-radius:999px;padding:2px}
.lang button{font:600 .8rem var(--f);letter-spacing:.06em;color:#ffffffb8;background:none;border:0;border-radius:999px;padding:.32rem .7rem;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy)}
.rt{display:flex;align-items:center;gap:.8rem}
@media(max-width:820px){.rt .pill{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

const slides=[...sl.children],ticks=[...tk.children],DUR=7000;
let cur=-1,timer=0;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function go(i,user){
  i=(i+S.length)%S.length;
  slides.forEach((s,j)=>s.classList.toggle("on",j===i));
  ticks.forEach((t,j)=>{t.classList.remove("on");t.classList.toggle("done",j<i);if(j===i){void t.offsetWidth;t.classList.add("on");t.style.setProperty("--d",DUR+"ms")}});
  cur=i;clearTimeout(timer);if(!reduce)timer=setTimeout(()=>go(cur+1),DUR);
  if(user&&reduce)ticks[i].classList.add("done");
}
$("#pv").onclick=()=>go(cur-1,true);$("#nx").onclick=()=>go(cur+1,true);
const hero=$("#top");
hero.addEventListener("mouseenter",()=>{hero.classList.add("paused");clearTimeout(timer)});
hero.addEventListener("mouseleave",()=>{hero.classList.remove("paused");if(!reduce)timer=setTimeout(()=>go(cur+1),DUR/2)});
let tx=0,ty=0;
hero.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
hero.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)go(cur+(dx<0?1:-1),true)},{passive:true});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1,true);if(e.key==="ArrowLeft")go(cur-1,true)});
